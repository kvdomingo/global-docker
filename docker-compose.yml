name: global-docker

networks:
  default:
    name: traefik
    driver: bridge
    ipam:
      config:
        - gateway: 172.20.0.1
          subnet: 172.20.0.0/24

volumes:
  portainer-data:
  kestra-db-data:
  kestra-app-data:

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    pull_policy: weekly
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: 'true'
      traefik.http.routers.traefik.rule: Host(`traefik.localhost`)
      traefik.http.routers.traefik.entrypoints: http
      traefik.http.routers.traefik.service: api@internal
      traefik.http.services.traefik.loadbalancer.server.port: 8080
      traefik.docker.network: traefik
    ports:
      - '80:80'

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    pull_policy: weekly
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    labels:
      traefik.enable: 'true'
      traefik.http.routers.portainer.rule: Host(`portainer.localhost`)
      traefik.http.routers.portainer.entrypoints: http
      traefik.http.routers.portainer.service: portainer
      traefik.http.services.portainer.loadbalancer.server.port: 9000

  kestra-init:
    image: busybox
    restart: no
    command: >-
      chown -R 1000:1000 /app/storage /app/data /tmp
    volumes:
      - kestra-app-data:/app/storage
      - kestra-db-data:/app/data
      - /tmp/kestra:/tmp

  kestra:
    image: kestra/kestra:latest
    restart: unless-stopped
    pull_policy: weekly
    command: [server, local]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra-app-data:/app/storage
      - kestra-db-data:/app/data
      - /tmp/kestra:/tmp
    labels:
      traefik.enable: 'true'
      traefik.http.routers.kestra.rule: Host(`kestra.localhost`)
      traefik.http.routers.kestra.entrypoints: http
      traefik.http.routers.kestra.service: kestra
      traefik.http.services.kestra.loadbalancer.server.port: 8080
    depends_on:
      kestra-init:
        condition: service_completed_successfully
